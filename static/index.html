<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOTO TECH Service</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#e6e8ed;background:#101217}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #34373d;padding-bottom:20px}h1{font-size:25px;margin:0}h2{font-size:18px}small,.sub{color:#9ca4ae}nav{display:flex;gap:7px;flex-wrap:wrap;margin:25px 0}button{border:0;background:#2b3039;color:white;padding:11px 15px;border-radius:9px;cursor:pointer}button.active,button.primary{background:#d63232}button:hover{filter:brightness(1.2)}section{display:none}section.active{display:block}.panel{background:#1b1e25;padding:19px;border:1px solid #343942;border-radius:13px;margin:13px 0}input,select,textarea{background:#101217;color:#fff;border:1px solid #454a54;border-radius:8px;padding:11px;width:100%;font:inherit}label{display:block;font-size:12px;color:#a9b0bb;margin-bottom:5px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field{min-width:0}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #363a43;padding:11px;font-size:14px}td button{padding:7px}th{color:#a5abb4;font-weight:500}.right{text-align:right}#message{min-height:24px;color:#f4b25c}.tag{background:#313946;padding:5px 8px;border-radius:8px}.cards{display:flex;gap:12px;flex-wrap:wrap}.metric{min-width:150px}.metric strong{display:block;font-size:28px;margin-top:7px}@media(max-width:600px){.wrap{padding:12px}table{display:block;overflow:auto}}
</style></head><body><div class="wrap"><div class="head"><div><h1>🏍 MOTO TECH <span style="color:#db3e3e">SERVICE</span></h1><small>Управление мотосервисом • MVP 0.1</small></div><span class="tag">Локальная версия</span></div>
<nav><button class="active" data-tab="dashboard">Главная</button><button data-tab="orders">Заказы</button><button data-tab="customers">Клиенты</button><button data-tab="vehicles">Техника</button><button data-tab="prices">Прайс</button></nav><p id="message"></p>
<section id="dashboard" class="active"><div id="metrics" class="cards"></div><div class="panel"><h2>Последние заказ-наряды</h2><div id="latest"></div></div></section>
<section id="customers"><div class="panel"><h2>Новый клиент</h2><form id="customerForm" class="fields"><div><label>Имя</label><input name="name" required></div><div><label>Телефон</label><input name="phone"></div><button class="primary">Сохранить</button></form></div><div class="panel"><h2>Клиенты</h2><div id="customerTable"></div></div></section>
<section id="vehicles"><div class="panel"><h2>Добавить технику</h2><form id="vehicleForm" class="fields"><div><label>Владелец</label><select name="customer_id" class="customerSelect" required></select></div><div><label>Тип</label><select name="kind"><option>Мотоцикл</option><option>Квадроцикл</option><option>Электросамокат</option><option>Электровелосипед</option></select></div><div><label>Марка</label><input name="brand"></div><div><label>Модель</label><input name="model"></div><div><label>VIN / рама</label><input name="vin"></div><div><label>Пробег</label><input name="mileage"></div><button class="primary">Сохранить</button></form></div><div class="panel"><h2>Техника</h2><div id="vehicleTable"></div></div></section>
<section id="prices"><div class="panel"><h2>Услуга</h2><form id="priceForm" class="fields"><input type="hidden" name="sid"><div><label>Раздел</label><input name="category" required></div><div><label>Наименование</label><input name="name" required></div><div><label>Цена, ₽</label><input name="price" type="number" min="0" step=".01" required></div><button class="primary">Сохранить</button></form></div><div class="panel"><h2>Каталог работ</h2><small>Начальные цены демонстрационные, требуют утверждения.</small><div id="priceTable"></div></div></section>
<section id="orders"><div class="panel"><h2>Создать заказ-наряд</h2><form id="orderForm" class="fields"><div><label>Клиент</label><select name="customer_id" class="customerSelect" required></select></div><div><label>Техника клиента</label><select name="vehicle_id" id="orderVehicle" required></select></div><div><label>Жалоба клиента</label><input name="complaint"></div><button class="primary">Создать</button></form></div><div class="panel"><h2>Заказ-наряды</h2><div id="orderTable"></div></div><div id="orderDetail"></div></section>
</div><script>
let data={customers:[],vehicles:[],services:[],orders:[]};let current=null;
const byId=id=>document.getElementById(id);const rub=k=>(Number(k||0)/100).toLocaleString('ru-RU',{style:'currency',currency:'RUB'});
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,method='GET',body){const response=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!response.ok){let m=await response.json().catch(()=>({}));throw Error(JSON.stringify(m.detail||'Ошибка запроса'))}return response.json()}
function flash(s){byId('message').textContent=s;setTimeout(()=>{if(byId('message').textContent===s)byId('message').textContent=''},4500)}
function options(list,name){return list.map(x=>'<option value="'+x.id+'">'+escape(x[name])+'</option>').join('')}
async function reload(){try{[data.customers,data.vehicles,data.services,data.orders]=await Promise.all(['customers','vehicles','services','orders'].map(s=>api(s)));render()}catch(e){flash(e.message)}}
function render(){document.querySelectorAll('.customerSelect').forEach(s=>{let selected=s.value;s.innerHTML=options(data.customers,'name');if(selected)s.value=selected});refreshVehicles();
byId('customerTable').innerHTML=table(['№','Имя','Телефон'],data.customers.map(c=>[c.id,escape(c.name),escape(c.phone)]));
byId('vehicleTable').innerHTML=table(['№','Тип','Марка / модель','Владелец'],data.vehicles.map(v=>[v.id,escape(v.kind),escape(v.brand+' '+v.model),escape(data.customers.find(c=>c.id===v.customer_id)?.name)]));
byId('priceTable').innerHTML=table(['Раздел','Работа','Цена',''],data.services.map(s=>[escape(s.category),escape(s.name),rub(s.price_kopecks),'<button onclick="editPrice('+s.id+')">Изменить</button>']));
let orderRows=data.orders.map(o=>['MT-'+String(o.id).padStart(6,'0'),escape(o.customer_name),escape(o.vehicle_name),escape(o.status),rub(o.total_kopecks),rub(o.paid_kopecks),'<button onclick="openOrder('+o.id+')">Открыть</button>']);
byId('orderTable').innerHTML=table(['Номер','Клиент','Техника','Статус','Сумма','Оплачено',''],orderRows);
byId('latest').innerHTML=table(['Заказ','Клиент','Статус'],orderRows.slice(0,7).map(r=>r.slice(0,2).concat([r[3]])));
byId('metrics').innerHTML=[['Заказов',data.orders.length],['В работе',data.orders.filter(x=>x.status==='В работе').length],['Ожидают',data.orders.filter(x=>x.status==='Ожидание запчастей').length],['Оплачено',rub(data.orders.reduce((a,x)=>a+Number(x.paid_kopecks),0))]].map(x=>'<div class="panel metric"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');
}
function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function refreshVehicles(){const owner=Number(byId('orderForm').elements.customer_id.value);byId('orderVehicle').innerHTML=options(data.vehicles.filter(v=>v.customer_id===owner),'model')}
byId('orderForm').elements.customer_id.addEventListener('change',refreshVehicles);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');byId(b.dataset.tab).classList.add('active')});
async function submit(id,path,map,method='POST'){const form=byId(id);form.onsubmit=async e=>{e.preventDefault();try{const values=Object.fromEntries(new FormData(form));await api(typeof path==='function'?path(values):path,method,map(values));form.reset();flash('Сохранено');await reload()}catch(err){flash(err.message)}}}
submit('customerForm','customers',x=>x);submit('vehicleForm','vehicles',x=>({...x,customer_id:Number(x.customer_id)}));submit('orderForm','orders',x=>({...x,customer_id:Number(x.customer_id),vehicle_id:Number(x.vehicle_id)}));
byId('priceForm').onsubmit=async e=>{e.preventDefault();const f=byId('priceForm'),x=Object.fromEntries(new FormData(f));try{await api('services'+(x.sid?'/'+x.sid:''),x.sid?'PUT':'POST',{category:x.category,name:x.name,price:x.price});f.reset();flash('Прайс сохранён');await reload()}catch(e){flash(e.message)}};
function editPrice(id){const x=data.services.find(s=>s.id===id);let f=byId('priceForm');for(let k of ['category','name'])f.elements[k].value=x[k];f.elements.price.value=x.price_kopecks/100;f.elements.sid.value=id;window.scrollTo({top:0,behavior:'smooth'})}
async function openOrder(id){current=id;try{const d=await api('orders/'+id),o=d.order;byId('orderDetail').innerHTML='<div class="panel"><h2>Заказ MT-'+String(id).padStart(6,'0')+'</h2><label>Статус</label><select id="status">'+['Принят','Диагностика','Согласование','В работе','Ожидание запчастей','Готов','Выдан','Закрыт'].map(x=>'<option '+(x===o.status?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Механик</label><input id="mechanic" value="'+escape(o.mechanic)+'"><button onclick="saveStatus()">Сохранить статус</button><h2>Работы и запчасти</h2>'+table(['Позиция','Кол-во','Цена','Согласование'],d.items.map(i=>[escape(i.description),escape(i.qty),rub(i.price_kopecks),i.approved?'Согласовано':'<button onclick="approveItem('+i.id+')">Согласовать</button>']))+'<h2>Добавить позицию</h2><form id="itemForm" class="fields"><div><label>Вид</label><select name="kind"><option value="work">Работа</option><option value="part">Запчасть</option></select></div><div><label>Наименование</label><input name="description" list="serviceNames" required><datalist id="serviceNames">'+data.services.map(s=>'<option value="'+escape(s.name)+'">').join('')+'</datalist></div><div><label>Количество</label><input name="quantity" value="1" type="number" step=".01" min=".01" required></div><div><label>Цена за ед., ₽</label><input name="unit_price" type="number" step=".01" min="0" required></div><div><label>Себестоимость, ₽</label><input name="unit_cost" type="number" step=".01" min="0" value="0" required></div><button class="primary">Добавить</button></form><h2>Оплата</h2><form id="payForm" class="fields"><div><label>Сумма, ₽</label><input type="number" name="amount" min=".01" step=".01" required></div><div><label>Способ</label><select name="method"><option>Наличные</option><option>Карта</option><option>Перевод</option><option>Счёт</option></select></div><button>Зарегистрировать оплату</button></form><h2>Журнал</h2>'+table(['Дата','Событие'],d.history.map(h=>[escape(h.at),escape(h.action)]))+'</div>';
byId('itemForm').elements.description.addEventListener('change',e=>{const s=data.services.find(s=>s.name===e.target.value);if(s)byId('itemForm').elements.unit_price.value=s.price_kopecks/100});
submit('itemForm',()=> 'orders/'+current+'/items',x=>x);submit('payForm',()=> 'orders/'+current+'/payments',x=>x);byId('orderDetail').scrollIntoView({behavior:'smooth'});
}catch(e){flash(e.message)}}
async function approveItem(id){try{await api('orders/'+current+'/approve/'+id,'POST');await reload();await openOrder(current)}catch(e){flash(e.message)}}
async function saveStatus(){try{await api('orders/'+current,'PATCH',{status:byId('status').value,mechanic:byId('mechanic').value});await reload();await openOrder(current)}catch(e){flash(e.message)}}
reload();
</script></body></html>
