name: MOTO TECH storage pilot checks
on:
  push:
    branches: [integration/storage-pilot]
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt httpx
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s backend/tests -v
