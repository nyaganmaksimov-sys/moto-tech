name: Android signed release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/android-app'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/moto_tech_icon.webp.base64 > app/src/main/res/drawable-nodpi/moto_tech_icon.webp
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.MOTO_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MOTO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTO_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOTO_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "Missing signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > release-signing.jks
          chmod 600 release-signing.jks
      - name: Build release APK
        env:
          MOTO_KEYSTORE_PATH: ../release-signing.jks
          MOTO_KEYSTORE_PASSWORD: ${{ secrets.MOTO_ANDROID_KEYSTORE_PASSWORD }}
          MOTO_KEY_ALIAS: ${{ secrets.MOTO_ANDROID_KEY_ALIAS }}
          MOTO_KEY_PASSWORD: ${{ secrets.MOTO_ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "MOTO-TECH-android-$VERSION.apk"
          test ! -z "$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "MOTO-TECH-android-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "MOTO-TECH-android-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MOTO TECH $VERSION" --notes "Signed Android release. Updates require the same signing certificate." --latest
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f release-signing.jks
