name: Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/android-app'
      - main
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/moto_tech_icon.webp.base64 > app/src/main/res/drawable-nodpi/moto_tech_icon.webp
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MOTO-TECH-Android-test-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Android 0.4.1 login recovery verification
