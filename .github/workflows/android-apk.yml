name: Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/android-app'
      - main
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/moto_tech_icon.webp.base64 > app/src/main/res/drawable-nodpi/moto_tech_icon.webp
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MOTO-TECH-Android-test-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish public direct-download test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          TAG="v$VERSION"
          # Publish ONLY on an existing release; do not create an unsigned production release.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          # Exclude 'android' from the asset name so Android's native signed-release
          # updater does NOT offer this debug-signed APK as a production upgrade.
          TEST_NAME="MOTO-TECH-test-debug-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$TEST_NAME"
          gh release upload "$TAG" "$TEST_NAME" --repo "$GITHUB_REPOSITORY" --clobber
