<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карточка техники — MOTO TECH</title><style>body{margin:0;background:#0d1119;color:#f5f5f7;font:16px system-ui,Arial}header{background:#171c25;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}a{color:#ff6479}main{max-width:900px;margin:25px auto;padding:0 16px}.card{background:#1c2330;border:1px solid #394152;border-radius:14px;padding:20px;margin-bottom:18px}button{background:#bd2942;color:white;border:0;border-radius:9px;padding:12px;margin:6px;cursor:pointer}p{line-height:1.6}.muted{color:#abb5c5}.item{padding:12px 0;border-bottom:1px solid #394152}#qrBox{padding:14px;background:white;display:inline-block;border-radius:9px}h1{font-size:22px}h2{font-size:18px}#error{color:#ff8796}</style></head><body><header><strong>MOTO <span style="color:#eb3b55">TECH</span> · Техника</strong><a href="./cloud.html">← Вернуться в систему</a></header><main><div class="card"><h1 id="heading">Загрузка карточки…</h1><p id="error" role="alert"></p><div id="info"></div><button id="qrButton" style="display:none">Показать QR техники</button><div id="qrArea" style="display:none"><h2>QR-код техники</h2><div id="qrBox"></div><p><button id="printQR">Распечатать QR</button></p></div></div><div class="card"><h2>История обслуживания</h2><div id="repairs">Загрузка…</div></div><div class="card"><h2>История хранения</h2><div id="storages">Загрузка…</div></div><div class="card"><h2>Фотографии приёмки и повреждений</h2><div id="photos">Загрузка…</div></div></main><script type="module">
import{createClient}from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kjgalcvxxjnapcaocvry.supabase.co','sb_publishable_D_l6wPXXDiAZJZZcgHL3VQ_6yR0iKeK',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');const mode=new URLSearchParams(location.search).get('mode');const valid=/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id||'');
function line(host,t){const e=document.createElement('p');e.textContent=t;host.append(e)}
function setError(e){$('error').textContent='Ошибка: '+(e?.message||e)}
async function confirmActionPin(){const pin=prompt('Подтвердите изменение личным PIN');if(pin===null)return false;const r=await db.rpc('check_my_pin',{candidate:pin});if(r.error||!r.data){setError(r.error||'Неверный PIN');return false}return true}
async function load(){try{if(!valid)throw new Error('Некорректный идентификатор техники');const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){const q=encodeURIComponent(location.pathname.split('/').pop()+location.search);location.href='./login.html?return='+q;return}
const {data:staff,error:staffError}=await db.from('staff').select('role,active').eq('auth_user_id',user.id).eq('active',true).maybeSingle();if(staffError||!staff)throw new Error('Нет действующих прав сотрудника');
const {data:v,error}=await db.from('vehicles').select('id,customer_id,brand,model,category,vin,year,mileage,plate').eq('id',id).maybeSingle();if(error)throw error;if(!v)throw new Error('Техника отсутствует или недоступна');$('heading').textContent=[v.brand,v.model].filter(Boolean).join(' ')||'Техника';const owner=await db.from('customers').select('full_name,phone').eq('id',v.customer_id).maybeSingle();if(owner.error)throw owner.error;
for(const text of ['Тип: '+(v.category||'—'),'VIN / рама: '+(v.vin||'не указан'),'Год: '+(v.year||'—'),'Пробег: '+(v.mileage??'—')+' км','Госномер: '+(v.plate||'—'),'Владелец: '+(owner.data?.full_name||'—'),'Телефон: '+(owner.data?.phone||'—')])line($('info'),text);
$('qrButton').style.display='inline-block';$('qrButton').onclick=showQR;
const isMechanic=staff.role==='mechanic';const checks=[['repairs',isMechanic?'mechanic_orders':'orders','id,order_number,status,complaint,created_at,deleted_at'],['storages',isMechanic?'mechanic_storage':'storage_records','contract_number,status,start_date'],['photos','vehicle_intake_photos','kind,object_path,defect_description,created_at']];
for(const [host,table,cols] of checks){const el=$(host);el.replaceChildren();const res=await db.from(table).select(cols) .eq('vehicle_id',id).order('created_at',{ascending:false}).limit(100);if(res.error){line(el,'Ошибка загрузки: '+res.error.message);continue}if(!res.data?.length){line(el,'Записей нет');continue}for(const item of res.data){if(host==='repairs'&&item.deleted_at)continue;const row=document.createElement('div');row.className='item';if(host==='repairs'){line(row,[item.order_number,item.status,item.complaint].filter(Boolean).join(' · '));if(item.status!=='Выдан'){const edit=document.createElement('button');edit.textContent='Редактировать заказ';edit.onclick=async()=>{const value=prompt('Описание проблемы',item.complaint||'');if(value===null)return;if(value.trim().length<3)return setError('Нужно минимум 3 символа');if(!await confirmActionPin())return;edit.disabled=true;const res=await db.rpc('update_repair_request',{p_order:item.id,p_complaint:value.trim()});if(res.error){setError(res.error);edit.disabled=false}else location.reload()};row.append(edit);if(['owner_manager','manager','administrator'].includes(staff.role)){const del=document.createElement('button');del.textContent='Удалить ошибочный заказ';del.onclick=async()=>{const reason=prompt('Причина удаления заказа (минимум 5 символов)');if(reason===null)return;if(reason.trim().length<5)return setError('Укажите причину удаления');if(!confirm('Убрать заказ из рабочих списков? История сохранится.'))return;if(!await confirmActionPin())return;del.disabled=true;const res=await db.rpc('admin_archive_bad_order',{p_order:item.id,p_reason:reason.trim()});if(res.error){setError(res.error);del.disabled=false}else location.reload()};row.append(del)}}}else if(host==='storages')line(row,[item.contract_number,item.status,item.start_date].filter(Boolean).join(' · '));else{line(row,'Фото: '+item.kind+(item.defect_description?' · '+item.defect_description:''));const btn=document.createElement('button');btn.textContent='Открыть фотографию';btn.onclick=async()=>{const signed=await db.storage.from('moto-intake-private').createSignedUrl(item.object_path,60);if(signed.error)setError(signed.error);else window.open(signed.data.signedUrl,'_blank','noopener,noreferrer')};row.append(btn)}el.append(row)}}
if(mode==='qr')showQR()
}catch(e){$('heading').textContent='Карточка техники';setError(e)}}
async function showQR(){const box=$('qrBox');$('qrArea').style.display='block';box.replaceChildren();try{if(!window.QRCode){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Библиотека QR недоступна'));document.head.append(s)})}const link=new URL('./vehicle-detail.html?id='+encodeURIComponent(id),location.href).toString();new window.QRCode(box,{text:link,width:220,height:220,correctLevel:window.QRCode.CorrectLevel.M});box.scrollIntoView({behavior:'smooth'})}catch(e){setError(e)}}
$('printQR').onclick=()=>window.print();await load();
</script></body></html>
