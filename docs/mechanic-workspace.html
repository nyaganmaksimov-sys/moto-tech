<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTO TECH — работы и заявки</title>
<style>
:root{font:15px system-ui,sans-serif;color:#eef1f5;background:#101319}*{box-sizing:border-box}body{margin:0}header{padding:18px 5%;background:#1b202a;border-bottom:1px solid #383e48;display:flex;justify-content:space-between}main{max-width:1050px;margin:24px auto;padding:0 16px}.card{background:#1b202a;border:1px solid #353d49;border-radius:14px;padding:19px;margin-bottom:16px}.muted{color:#aeb6c3}h2{font-size:19px}input,select,textarea,button{font:inherit;border-radius:9px;padding:10px;background:#11161f;border:1px solid #465064;color:white}button{background:#c93547;border:0;cursor:pointer}button:disabled{opacity:.45}label{display:grid;gap:5px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.work{padding:12px;border-top:1px solid #343c49}.money{color:#82daa6;font-weight:750}.hidden{display:none}a{color:#ff9aa5}.error{color:#ff9aa5}
</style></head><body><header><strong>MOTO <span style="color:#ec495b">TECH</span> · Рабочий кабинет</strong><button id="logout" class="hidden">Выйти</button></header><main><p id="message" role="status"></p>
<section id="login" class="card"><h2>Вход сотрудника</h2><form id="loginForm"><label>Логин<input id="username" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></section>
<section id="desk" class="hidden"><div class="card"><div class="row"><h2 id="name"></h2><button id="refresh">Обновить</button></div><p class="muted" id="info"></p></div>
<div class="grid"><div class="card"><h2>Мои работы и начисления</h2><h2 class="money" id="earnings"></h2><div id="repairs"></div></div>
<div class="card"><h2>Заявки на запчасти</h2><div id="requests"></div></div></div></section></main>
<script>
let token=null,profile=null,repairs=[];
const el=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(Number(n||0));
const statusNames={requested:'На рассмотрении',approved:'Одобрено',ordered:'Заказано',in_transit:'В пути',received:'Получено',issued:'Передано механику',rejected:'Отклонено',cancelled:'Отменено'};
function node(tag,text,cls){const x=document.createElement(tag);x.textContent=String(text??'');if(cls)x.className=cls;return x}
function clear(id){el(id).replaceChildren()}
function report(e){el('message').textContent=e?.message||String(e)}
async function api(path,method='GET',payload){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+token,...(payload?{'Content-Type':'application/json'}:{})},body:payload?JSON.stringify(payload):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Ошибка '+r.status);return j}
el('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:el('username').value,password:el('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Не удалось войти');token=d.access_token;profile=d.profile;el('password').value='';el('login').classList.add('hidden');el('desk').classList.remove('hidden');el('logout').classList.remove('hidden');el('name').textContent=profile.full_name;await refresh()}catch(err){report(err)}};
el('logout').onclick=()=>{token=null;profile=null;repairs=[];el('login').classList.remove('hidden');el('desk').classList.add('hidden');el('logout').classList.add('hidden');el('message').textContent=''};
el('refresh').onclick=()=>refresh().catch(report);
async function refresh(){el('message').textContent='';if(profile.role==='mechanic'){const [e,r]=await Promise.all([api('/mechanic/my-earnings'),api('/parts-requests')]);repairs=e.orders;el('info').textContent='Видны только ваши начисления (40% от работ), без стоимости заказа и запчастей.';el('earnings').textContent=fmt(e.my_earnings_total_rub);drawRepairs(e.orders);drawRequests(r,false)}else{el('info').textContent='Управление запросами запчастей';el('earnings').textContent='';clear('repairs');const r=await api('/parts-requests');drawRequests(r,true)}}
function drawRepairs(orders){clear('repairs');if(!orders.length){el('repairs').append(node('p','Назначенных работ пока нет.','muted'));return}for(const o of orders){const card=node('div','','work');card.append(node('strong',o.order_number+' · '+o.brand+' '+o.model),node('p','Ваш заработок: '+fmt(o.my_earnings_rub),'money'));for(const w of o.works){card.append(node('div',w.description+' — '+fmt(w.my_earnings_rub),'muted'))}const form=document.createElement('form');form.innerHTML='<h3>Запросить запчасть</h3><label>Название<input name="part_name" minlength="2" required></label><label>Артикул<input name="sku"></label><label>Количество<input type="number" name="quantity" min=".001" step=".001" value="1" required></label><label>Комментарий<textarea name="notes"></textarea></label><button>Отправить заявку</button>';form.onsubmit=async e=>{e.preventDefault();const d=new FormData(form);try{await api('/parts-requests','POST',{repair_id:o.repair_id,part_name:d.get('part_name'),sku:d.get('sku')||null,quantity:Number(d.get('quantity')),notes:d.get('notes')||null});await refresh();el('message').textContent='Заявка отправлена руководителю'}catch(err){report(err)}};card.append(form);el('repairs').append(card)}}
function drawRequests(items,manager){clear('requests');if(!items.length){el('requests').append(node('p','Заявок пока нет.','muted'));return}for(const x of items){const c=node('div','','work');c.append(node('strong',x.part_name+' · '+x.quantity),node('p',statusNames[x.status]||x.status,'muted'));if(x.notes)c.append(node('p',x.notes,'muted'));if(x.manager_comment)c.append(node('p','Руководитель: '+x.manager_comment,'muted'));if(manager){const sel=document.createElement('select');const steps={requested:['approved','ordered','rejected','cancelled'],approved:['ordered','rejected','cancelled'],ordered:['in_transit','received','cancelled'],in_transit:['received','cancelled'],received:['issued']};for(const v of steps[x.status]||[]){const opt=document.createElement('option');opt.value=v;opt.textContent=statusNames[v];sel.append(opt)}if(sel.options.length){const comment=document.createElement('textarea');comment.placeholder='Комментарий руководителя';const btn=node('button','Обновить статус');btn.onclick=async()=>{try{await api('/parts-requests/'+x.id+'/status','PATCH',{status:sel.value,comment:comment.value});await refresh()}catch(err){report(err)}};c.append(sel,comment,btn)}}el('requests').append(c)}}
</script></body></html>
