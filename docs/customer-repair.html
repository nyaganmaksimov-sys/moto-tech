<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ход ремонта — MOTO TECH</title><style>body{background:#0f131b;color:#f6f7fa;font:16px system-ui,Arial;margin:0}header{background:#1a202c;padding:18px 20px;font-weight:800}header span{color:#eb455e}main{max-width:760px;margin:24px auto;padding:0 14px}.card{background:#202838;border:1px solid #384253;border-radius:14px;padding:22px;margin-bottom:16px}h1{font-size:24px}p{line-height:1.5;color:#cdd4df}.message{border:1px solid #414a5a;border-radius:10px;padding:12px;margin:10px 0}.message.mine{background:#293a47}small{color:#aeb7c8}textarea{box-sizing:border-box;width:100%;min-height:105px;background:#131a26;color:white;border:1px solid #5c6676;border-radius:8px;padding:12px;font:inherit}button{background:#d83c54;color:white;border:0;border-radius:9px;padding:12px 20px;cursor:pointer;margin-top:10px}button:disabled{opacity:.6}.error{color:#ffabb7}</style></head><body><header>MOTO <span>TECH</span> · Статус ремонта</header><main><div class="card"><h1 id="heading">Проверяем ссылку…</h1><div id="summary"></div><p id="error" class="error" role="alert"></p><button id="refresh" type="button">Обновить статус</button></div><div class="card"><h2>Вопросы и ответы</h2><div id="messages"></div><form id="replyForm"><label for="reply">Сообщение сервису</label><textarea id="reply" maxlength="2000" placeholder="Напишите ответ механику или вопрос о ремонте" required></textarea><button type="submit" id="send">Отправить сообщение</button></form></div><p><small>Ссылка персональная. Не передавайте её посторонним. Сообщения видны сотрудникам сервиса.</small></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kjgalcvxxjnapcaocvry.supabase.co','sb_publishable_D_l6wPXXDiAZJZZcgHL3VQ_6yR0iKeK');
const token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);
function paragraph(host,text){const el=document.createElement('p');el.textContent=text;host.append(el)}
async function load(){const box=$('messages');$('error').textContent='';if(!/^[a-f0-9]{64}$/.test(token)){$('heading').textContent='Ссылка недействительна';$('replyForm').style.display='none';return}const result=await db.rpc('customer_repair_snapshot',{p_token:token});if(result.error||!result.data){$('heading').textContent='Ссылка недействительна или отключена';$('replyForm').style.display='none';$('error').textContent=result.error?.message||'';return}const d=result.data;$('heading').textContent='Заказ '+d.order_number;$('summary').replaceChildren();paragraph($('summary'),'Техника: '+(d.vehicle||'—'));paragraph($('summary'),'Статус: '+(d.status||'—'));paragraph($('summary'),'Обновлён: '+(d.updated_at?new Date(d.updated_at).toLocaleString('ru-RU'):'—'));box.replaceChildren();for(const m of d.messages||[]){const div=document.createElement('div');div.className='message'+(m.by==='client'?' mine':'');const b=document.createElement('b');b.textContent=m.by==='client'?'Вы':'MOTO TECH';div.append(b);paragraph(div,m.body);const stamp=document.createElement('small');stamp.textContent=new Date(m.created_at).toLocaleString('ru-RU');div.append(stamp);box.append(div)}if(!d.messages?.length)paragraph(box,'Сообщений пока нет')}
$('refresh').onclick=load;$('replyForm').onsubmit=async e=>{e.preventDefault();const button=$('send');if(button.disabled)return;button.disabled=true;const text=$('reply').value.trim();try{const r=await db.rpc('customer_repair_reply',{p_token:token,p_body:text});if(r.error||!r.data)throw new Error(r.error?.message||'Ссылка недействительна');$('reply').value='';await load()}catch(err){$('error').textContent=err.message}finally{button.disabled=false}};
await load();</script></body></html>
